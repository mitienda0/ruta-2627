<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#1f45d6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viaje">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<title>Viaje a Europa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: práctico y alegre, una app de bolsillo para 5 amigos de viaje
   IDEA: la tarjeta de embarque — cada actividad es un talón con hora grande colgando
   PICTURE: la agenda del día misma, con la próxima actividad como pase destacado
   COLOUR: azul cobalto dominante, blanco, un coral para "ahora"; de noche cobalto profundo
   TYPE / LAYOUT: Archivo para horas y títulos, Inter para texto; una columna, barra de pestañas abajo */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6fb,#0b1430);--card:light-dark(#fff,#131f45);--ink:light-dark(#0e1530,#eef1fb);
--mut:light-dark(#5a6382,#9aa5c8);--line:light-dark(#dde2ef,#24315e);--pri:light-dark(#1f45d6,#6f8cff);
--pri-ink:#fff;--hot:#ff5a3c;--soft:light-dark(#e7ecfb,#1b2a5c);--ok:light-dark(#127a4a,#5fd49a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:86px}
h1,h2,h3,.t{font-family:Archivo,Inter,sans-serif}
h2{font-size:28px;line-height:1.1;margin:0 0 4px;text-wrap:balance}
h3{font-size:18px;margin:22px 0 8px}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,14px)}
header{background:light-dark(#1f45d6,#15235a);color:var(--pri-ink);padding:calc(16px + env(safe-area-inset-top)) 0 14px}
header h1{margin:0;font-size:22px;font-weight:800}
.clocks{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.9;margin-top:2px}
.who{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
.who button{flex:none;border:1px solid #ffffff66;background:transparent;color:#fff;border-radius:99px;padding:8px 14px;font:500 14px Inter;min-height:38px;cursor:pointer}
.who button.on{background:#fff;color:#1f45d6;border-color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1 0 auto;min-width:76px;text-align:center;padding:14px 8px;color:var(--mut);text-decoration:none;font:600 13px Inter;border-top:3px solid transparent}
nav.tabs a.on{color:var(--pri);border-top-color:var(--pri)}
main{padding-top:20px}
.sub{color:var(--mut);margin:0 0 14px}
.row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;position:relative}
.row .h{font:700 22px/1 Archivo;white-space:nowrap}
.row .h small{display:block;font:500 11px Inter;color:var(--mut);margin-top:5px;white-space:normal}
.row .tt{font-weight:600;font-size:16px}
.row .meta{color:var(--mut);font-size:14px}
.row.past{opacity:.5}
.row.next{border:2px solid var(--hot);box-shadow:0 6px 20px -10px var(--hot)}
.row.wake{background:var(--soft)}
.pill{display:inline-block;font:600 12px Inter;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--pri);margin-right:6px;white-space:nowrap}
.pill.tbd{background:#ffe3dc;color:#b3301a}
.pill.hot{background:var(--hot);color:#fff}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}
.big{font:800 clamp(40px,11vw,64px)/1 Archivo;color:var(--pri)}
.btn{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:12px 16px;font:600 15px Inter;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.btn.red{background:#c62f17}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.daynav .btn{padding:10px 14px}
.split{border:2px solid var(--pri)}.sp2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}.sp2 div{background:var(--soft);border-radius:12px;padding:12px}.sp2 b{display:block;font:700 17px Archivo}.sp2 span{color:var(--mut);font-size:14px}
h3.grp{color:var(--pri)}
.ro .edonly,.ro [data-new],.ro [data-wake],.ro #fC,.ro [data-delc],.ro [data-delco],.ro .addco{display:none!important}.ro .row,.ro .card{cursor:default}
.tks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;padding:14px}.tks b{display:block;font:800 28px Archivo;color:var(--pri)}.tks span{font-size:13px;color:var(--mut)}
.chk select{width:auto;max-width:46%;flex:none;font-size:14px;min-height:40px;padding:6px 8px}.tk-sacar{border-color:var(--hot)}.tk-sacar select{color:#c62f17;font-weight:600}.tk-ok span{color:var(--mut)}.tk-ok select{color:var(--ok);font-weight:600}.tk-no{opacity:.6}
.empty{color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:20px}
.cal .dn{font:600 12px Inter;color:var(--mut);text-align:center;padding:4px 0}
.cal .c{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:74px;padding:5px;font-size:11px;cursor:pointer;overflow:hidden}
.cal .c.out{background:transparent;border-style:dashed;opacity:.55}
.cal .c.trip{border-color:var(--pri)}
.cal .c.today{outline:2px solid var(--hot)}
.cal .c b{font:700 14px Archivo;display:block}
.cal .c i{font-style:normal;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.cal .c .city{color:var(--pri);font-weight:600}
.cal .blank{min-height:74px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center}
.num{font:700 18px Archivo;white-space:nowrap;text-align:right}
.chk{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.chk input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.chk.done span{text-decoration:line-through;color:var(--mut)}
.chk span{flex:1}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;min-width:36px;min-height:36px}
label{display:block;font:600 13px Inter;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:16px Inter;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
textarea{min-height:70px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.ppl label{display:flex;gap:6px;align-items:center;margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:99px;color:var(--ink);font-weight:500;cursor:pointer}
.ppl input{width:18px;height:18px;min-height:0}
#lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}#lock form{width:min(380px,100%);color:var(--ink)}#lock svg{color:var(--pri)}
#ov{position:fixed;inset:0;background:#0009;display:none;z-index:9;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
#dlg{background:var(--card);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:10;max-width:90vw}
.note{font-size:13px;color:var(--mut)}
.code{font:700 16px Archivo;letter-spacing:.04em}
a{color:var(--pri)}
@media(max-width:600px){h2{font-size:24px}.row{grid-template-columns:64px minmax(0,1fr)}.row .h{font-size:19px}.cal .c{min-height:58px;font-size:10px}.cal .c i:nth-of-type(n+2){display:none}.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.row.next{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{box-shadow:0 6px 26px -6px var(--hot)}}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="tripName">Viaje a Europa</h1>
  <div class="clocks" id="clocks"></div>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" id="tabs">
  <a href="#hoy" data-t="hoy">Hoy</a><a href="#manana" data-t="manana">Mañana</a><a href="#calendario" data-t="calendario">Calendario</a><a href="#reservas" data-t="reservas">Reservas</a><a href="#listas" data-t="listas">Listas</a><a href="#info" data-t="info">Info</a>
</nav>
<div id="lock"><form id="lockF"><svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><rect x="10" y="28" width="44" height="30" rx="6" fill="currentColor"/><path d="M20 28v-8a12 12 0 0 1 24 0v8" fill="none" stroke="currentColor" stroke-width="6"/></svg>
<h2>Viaje</h2><p class="sub">Poné la contraseña del grupo. Se pide una sola vez en este teléfono.</p>
<label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="off" required>
<p id="lockE" style="color:#c62f17;min-height:1.5em;margin:8px 0"></p><button class="btn" style="width:100%">Entrar</button></form></div>
<div id="ov"><div id="dlg"></div></div>
<div id="toast"></div>
<script>
{
let PEOPLE=[];
const TZS=[["America/Argentina/Buenos_Aires","Argentina"],["Europe/Rome","Europa central (Italia, Francia, España, Alemania, Suiza…)"],["Europe/London","Reino Unido / Portugal"],["Europe/Athens","Grecia / Finlandia"]];
const TZN={"America/Argentina/Buenos_Aires":"ARG","Europe/Rome":"Europa","Europe/London":"UK/PT","Europe/Athens":"GR"};
const TYPES=[["despertar","Despertarse"],["vuelo","Vuelo"],["tren","Tren"],["subte","Subte / metro"],["bus","Micro / bus"],["traslado","Traslado / taxi"],["hotel","Alojamiento"],["actividad","Actividad"],["comida","Comida"],["aviso","Aviso"]];
const TN=Object.fromEntries(TYPES);
const RES_TYPES=["vuelo","tren","bus","hotel","actividad","traslado"];
const COUNTRY={
Italia:{m:"Euro (EUR)",e:"112",p:"C, F y L · 230 V",tip:"No es obligatoria; en muchos lugares cobran 'coperto' (cubierto) en la cuenta.",f:"Hola: Ciao / Buongiorno · Gracias: Grazie · La cuenta: Il conto, per favore"},
Francia:{m:"Euro (EUR)",e:"112",p:"C y E · 230 V",tip:"El servicio suele estar incluido ('service compris'); redondear es opcional.",f:"Hola: Bonjour · Gracias: Merci · La cuenta: L'addition, s'il vous plaît"},
"España":{m:"Euro (EUR)",e:"112",p:"C y F · 230 V",tip:"Opcional; dejar algo de cambio es lo habitual.",f:"Igual que acá, con 'vale' para todo"},
Alemania:{m:"Euro (EUR)",e:"112",p:"C y F · 230 V",tip:"Se suele redondear un 5–10 % al pagar.",f:"Hola: Hallo · Gracias: Danke · La cuenta: Die Rechnung, bitte"},
Austria:{m:"Euro (EUR)",e:"112",p:"C y F · 230 V",tip:"Redondear un 5–10 % es lo común.",f:"Hola: Grüß Gott / Hallo · Gracias: Danke"},
Suiza:{m:"Franco suizo (CHF)",e:"112",p:"C y J · 230 V",tip:"El servicio va incluido; redondear es opcional.",f:"Según la zona: alemán, francés o italiano"},
"Países Bajos":{m:"Euro (EUR)",e:"112",p:"C y F · 230 V",tip:"Opcional, se suele redondear.",f:"Hola: Hallo · Gracias: Dank je wel"},
"Bélgica":{m:"Euro (EUR)",e:"112",p:"C y E · 230 V",tip:"El servicio suele estar incluido.",f:"Francés o neerlandés según la zona"},
Portugal:{m:"Euro (EUR)",e:"112",p:"C y F · 230 V",tip:"Opcional, 5–10 % si el servicio estuvo bien.",f:"Hola: Olá · Gracias: Obrigado / Obrigada"},
Grecia:{m:"Euro (EUR)",e:"112",p:"C y F · 230 V",tip:"Se suele dejar un 5–10 %.",f:"Hola: Yiá sas · Gracias: Efcharistó"},
"Reino Unido":{m:"Libra (GBP)",e:"999 o 112",p:"G · 230 V",tip:"10–12,5 %; fijate si ya viene 'service charge'.",f:"Inglés"},
"República Checa":{m:"Corona checa (CZK)",e:"112",p:"C y E · 230 V",tip:"Se suele redondear un 10 %.",f:"Hola: Dobrý den · Gracias: Děkuji"},
"Hungría":{m:"Forinto (HUF)",e:"112",p:"C y F · 230 V",tip:"10–15 % es lo habitual.",f:"Hola: Szia · Gracias: Köszönöm"},
Croacia:{m:"Euro (EUR)",e:"112",p:"C y F · 230 V",tip:"Opcional, 10 % en restaurantes.",f:"Hola: Bok · Gracias: Hvala"}};

let S={items:[],checklist:[],config:{}};
let DONE={};try{DONE=JSON.parse(localStorage.getItem("viaje-done")||"{}")}catch(e){}
let TK={},TKX=[];try{TK=JSON.parse(localStorage.getItem("viaje-tk")||"{}");TKX=JSON.parse(localStorage.getItem("viaje-tkx")||"[]")}catch(e){}
const saveTK=()=>{try{localStorage.setItem("viaje-tk",JSON.stringify(TK));localStorage.setItem("viaje-tkx",JSON.stringify(TKX))}catch(e){}};
const TKS=[["","Sin definir"],["sacar","Hay que sacar"],["ok","Ya está"],["no","No hace falta"]];
const me="Todos";
let db=null,dbState="cargando",dayCursor=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(s,n)=>{const[y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d+n);return ymd(t)};
const fmtDay=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})};
const shortDay=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-AR",{weekday:"short",day:"2-digit",month:"2-digit"})};
function tzOff(ms,tz){const p={};new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);return Date.UTC(+p.year,p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-ms}
function toMs(date,time,tz){if(!date)return NaN;const[y,m,d]=date.split("-").map(Number);const[h,mi]=(time||"00:00").split(":").map(Number);const g=Date.UTC(y,m-1,d,h,mi);let ms=g-tzOff(g,tz||"Europe/Rome");const o2=tzOff(ms,tz||"Europe/Rome");return g-o2}
function until(ms){let m=Math.round((ms-Date.now())/60000);if(m<1)return"ahora";const d=Math.floor(m/1440);m-=d*1440;const h=Math.floor(m/60);m-=h*60;return"en "+(d?d+" d ":"")+(h?h+" h ":"")+(d?"":m+" min")}
const whoTxt=w=>!w||!w.length||w.length===PEOPLE.length?"Todos":w.length===1?w[0]:w.slice(0,-1).join(", ")+" y "+w[w.length-1];
const mine=it=>me==="Todos"||!it.who||!it.who.length||it.who.includes(me);
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3200)}
function save(){}
const today=()=>ymd(new Date());
const cfg=()=>Object.assign({name:"Viaje a Europa",start:"2026-12-28",end:"2027-01-24",countries:["Italia"],rates:{}},S.config||{});

/* entries for a day: starts + arrivals/check-outs */
function entries(day){const out=[];
 for(const it of S.items){if(!mine(it))continue;
  if(it.date===day)out.push({it,kind:"start",ms:toMs(it.date,it.time||it.sortTime,it.tz),time:it.time,tz:it.tz});
  if(it.endDate&&it.endDate===day&&it.endDate!==it.date)out.push({it,kind:it.type==="hotel"?"checkout":"arrive",ms:toMs(it.endDate,it.endTime,it.endTz||it.tz),time:it.endTime,tz:it.endTz||it.tz});}
 return out.sort((a,b)=>(a.ms||0)-(b.ms||0))}
function rowHTML(e,ctx){const it=e.it,now=Date.now();
 const endMs=it.endDate?toMs(it.endDate,it.endTime,it.endTz||it.tz):e.ms+60*60000;
 const past=ctx.isToday&&e.kind==="start"&&endMs<now||ctx.isToday&&e.kind!=="start"&&e.ms<now;
 let lbl=e.kind==="arrive"?"Llegada · "+it.title:e.kind==="checkout"?"Check-out · "+it.title:it.title;
 let meta=[];
 if(e.kind==="start"&&it.endDate){meta.push((it.type==="hotel"?"Hasta ":"Llega ")+shortDay(it.endDate)+(it.endTime?" "+it.endTime:"")+(it.endTz&&it.endTz!==it.tz?" (hora "+TZN[it.endTz]+")":""))}
 else if(e.kind==="start"&&it.endTime)meta.push("Hasta "+it.endTime);
 if(e.kind==="arrive")meta.push("Salió "+shortDay(it.date)+" "+(it.time||"")+" (hora "+(TZN[it.tz]||"")+")");
 if(it.place)meta.push(esc(it.place));
 const cls=["row",past?"past":"",ctx.next===e?"next":"",it.type==="despertar"?"wake":""].join(" ");
 return `<div class="${cls}" tabindex="0" data-edit="${esc(it.id)}"><div class="h">${esc(e.time||"--:--")}<small>hora ${esc(TZN[e.tz]||"")}</small></div><div>
 <div>${ctx.next===e?`<span class="pill hot">Próximo · ${until(e.ms)}</span>`:""}<span class="pill">${esc(TN[it.type]||"Actividad")}</span>${it.tbd?'<span class="pill tbd">A confirmar</span>':""}</div>
 <div class="tt">${esc(lbl)}</div>
 <div class="meta">${meta.map(m=>m).join(" · ")}</div>
 <div class="meta">${esc(whoTxt(it.who))}${it.code?` · Código <span class="code">${esc(it.code)}</span>`:""}</div>
 ${it.notes?`<div class="meta">${esc(it.notes)}</div>`:""}
 ${it.place?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.place)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Abrir en Maps</a>`:""}
 </div></div>`}
function splitBanner(day){const sp=S.items.find(it=>it.split&&it.date===day);if(!sp)return"";
 return `<div class="hero split" data-edit="${esc(sp.id)}" style="cursor:pointer"><div class="note">${day===today()?"Hoy":"Este día"} se separa el grupo${sp.tbd?' <span class="pill tbd">Fecha a confirmar</span>':""}</div>
 <div class="sp2">${(sp.groups||[]).map(g=>`<div><b>${esc(g.who)}</b><span>${esc(g.to)}</span></div>`).join("")}</div>${sp.notes?`<p class="note" style="margin:10px 0 0">${esc(sp.notes)}</p>`:""}</div>`}
function dayList(day,title){const es=entries(day).filter(e=>!e.it.split),isToday=day===today(),now=Date.now();
 const next=isToday?es.find(e=>e.ms>now):null;
 const groups=[];for(const e of es){const k=whoTxt(e.it.who);let g=groups.find(x=>x.k===k);if(!g){g={k,es:[]};groups.push(g)}g.es.push(e)}
 groups.sort((a,b)=>(a.k==="Todos"?0:1)-(b.k==="Todos"?0:1));
 const multi=groups.length>1||groups.length===1&&groups[0].k!=="Todos";
 return `<h2>${esc(title)}</h2><p class="sub">${esc(fmtDay(day))}${cityTxt(day)?" · <b>"+esc(cityTxt(day))+"</b>":""}</p>${splitBanner(day)}
 ${es.length?groups.map(g=>(multi?`<h3 class="grp">${g.k==="Todos"?"Todos juntos":"Lo que tienen que hacer "+esc(g.k)}</h3>`:"")+g.es.map(e=>rowHTML(e,{isToday,next})).join("")).join(""):`<div class="empty">No hay nada cargado para este día.</div>`}
 <div class="bar" style="margin-top:12px"><button class="btn" data-new="${day}">Agregar actividad</button><button class="btn ghost" data-wake="${day}">Agregar hora de despertarse</button></div>`}
function vHoy(){const c=cfg(),t=today(),startMs=toMs(c.start,"00:00","America/Argentina/Buenos_Aires");let h="";
 if(Date.now()<startMs){const d=Math.ceil((startMs-Date.now())/864e5);
  const up=S.items.filter(mine).map(it=>({it,ms:toMs(it.date,it.time,it.tz)})).filter(x=>x.ms>Date.now()).sort((a,b)=>a.ms-b.ms)[0];
  const pend=S.checklist.filter(x=>!DONE[x.id]&&(me==="Todos"||!x.who||x.who==="Todos"||x.who===me)).length;
  h+=`<div class="hero"><div class="note">Faltan</div><div class="big">${d} ${d===1?"día":"días"}</div><div class="sub" style="margin:6px 0 0">Salida ${esc(fmtDay(c.start))}</div>
  ${up?`<p style="margin:12px 0 0"><b>Lo próximo:</b> ${esc(up.it.title)} · ${esc(shortDay(up.it.date))} ${esc(up.it.time||"")} (${until(up.ms)})</p>`:""}
  <p style="margin:8px 0 0"><a href="#listas">${pend} pendientes en las listas</a></p></div>`}
 if(dayCursor===null)dayCursor=t;
 const lbl=dayCursor===t?"Hoy":dayCursor===addDays(t,1)?"Mañana":"Día";
 h+=`<div class="daynav"><button class="btn ghost" data-dn="-1" aria-label="Día anterior">‹</button><button class="btn ghost" data-dn="0">Hoy</button><button class="btn ghost" data-dn="1" aria-label="Día siguiente">›</button></div>`+dayList(dayCursor,lbl);
 return h}
function vManana(){const t=addDays(today(),1),es=entries(t);const wake=es.find(e=>e.it.type==="despertar");
 let h="";if(!wake)h+=`<div class="hero"><b>Todavía no hay hora de despertarse para mañana.</b><p class="sub edonly" style="margin:4px 0 10px">Cargala para que todos la vean al abrir la app.</p><button class="btn" data-wake="${t}">Poner despertador</button></div>`;
 else h+=`<div class="hero"><div class="note">Mañana se levantan a las</div><div class="big">${esc(wake.time)}</div><div class="sub" style="margin:6px 0 0">${esc(whoTxt(wake.it.who))}</div></div>`;
 return h+dayList(t,"Mañana")}
function staysOn(day){return (cfg().stays||[]).filter(s=>day>=s.from&&day<s.to)}
function cityTxt(day){return staysOn(day).map(s=>s.city+(s.who&&s.who.length&&s.who.length<PEOPLE.length?" ("+whoTxt(s.who)+")":"")).join(" · ")}
function vCal(){const c=cfg();let s=c.start,e=c.end;for(const it of S.items){if(it.date&&it.date<s)s=it.date;const z=it.endDate||it.date;if(z&&z>e)e=z}
 const city={};for(const it of S.items)if(it.type==="hotel"&&it.date&&mine(it)){let d=it.date;const end=it.endDate||it.date;let n=0;while(d<end&&n<60){city[d]=it.city||it.title;d=addDays(d,1);n++}}
 for(const st of (c.stays||[])){let d=st.from,n=0;while(d<st.to&&n<60){city[d]=(city[d]?city[d]+" · ":"")+st.city;d=addDays(d,1);n++}}
 let[y,m]=s.split("-").map(Number);const[ey,em]=e.split("-").map(Number);let h=`<h2>Calendario</h2><p class="sub">${esc(shortDay(c.start))} → ${esc(shortDay(c.end))} · tocá un día para verlo</p>`;
 while(y<ey||y===ey&&m<=em){const first=new Date(y,m-1,1),dim=new Date(y,m,0).getDate(),off=(first.getDay()+6)%7;
  h+=`<h3>${first.toLocaleDateString("es-AR",{month:"long",year:"numeric"})}</h3><div class="cal">`+["L","M","M","J","V","S","D"].map(x=>`<div class="dn">${x}</div>`).join("")+`<div class="blank"></div>`.repeat(off);
  for(let d=1;d<=dim;d++){const ds=y+"-"+pad(m)+"-"+pad(d),es=entries(ds),inTrip=ds>=c.start&&ds<=c.end;
   h+=`<div class="c ${inTrip?"trip":"out"} ${ds===today()?"today":""}" data-day="${ds}" tabindex="0"><b>${d}</b>${city[ds]?`<i class="city">${esc(city[ds])}</i>`:""}${es.slice(0,3).map(x=>`<i>${esc(x.time||"")} ${esc(x.it.title)}</i>`).join("")}</div>`}
  h+=`</div>`;m++;if(m>12){m=1;y++}}
 return h}
function vRes(){const its=S.items.filter(it=>mine(it)&&RES_TYPES.includes(it.type)).sort((a,b)=>toMs(a.date,a.time,a.tz)-toMs(b.date,b.time,b.tz));
 return `<h2>Reservas</h2><p class="sub">Vuelos, trenes, alojamientos y entradas con sus códigos.</p>`+(its.length?its.map(it=>`<div class="card" data-edit="${esc(it.id)}" style="cursor:pointer"><div class="line"><div><span class="pill">${esc(TN[it.type])}</span>${it.tbd?'<span class="pill tbd">A confirmar</span>':""}<div class="tt" style="font-weight:600;margin-top:4px">${esc(it.title)}</div>
 <div class="note">${esc(shortDay(it.date))} ${esc(it.time||"")} (${esc(TZN[it.tz]||"")})${it.endDate?" → "+esc(shortDay(it.endDate))+" "+esc(it.endTime||"")+" ("+esc(TZN[it.endTz||it.tz]||"")+")":""}</div><div class="note">${esc(whoTxt(it.who))}${it.place?" · "+esc(it.place):""}</div></div>
 ${it.code?`<div style="text-align:right"><div class="code">${esc(it.code)}</div><button class="btn ghost" data-copy="${esc(it.code)}" style="margin-top:6px">Copiar</button></div>`:`<div class="note">Sin código</div>`}</div></div>`).join(""):`<div class="empty">Todavía no hay reservas.</div>`)+`<div class="bar" style="margin-top:12px"><button class="btn" data-new="${cfg().start}" data-ntype="vuelo">Agregar reserva</button></div>`}
function vTickets(){const all=[...(cfg().tickets||[]),...TKX.map(x=>Object.assign({mine:true},x))],cats={};for(const t of all)(cats[t.cat||"Otros"]=cats[t.cat||"Otros"]||[]).push(t);
 const cnt=k=>all.filter(t=>(TK[t.id]||"")===k).length;
 return `<h2>Entradas y reservas</h2><p class="sub">Marcá qué hay que sacar, qué ya está y qué no hace falta. Se guarda en tu teléfono.</p>
 <div class="hero tks"><div><b>${cnt("sacar")}</b><span>hay que sacar</span></div><div><b>${cnt("ok")}</b><span>ya están</span></div><div><b>${cnt("")}</b><span>sin definir</span></div></div>`+
 Object.entries(cats).map(([c,xs])=>`<h3>${esc(c)}</h3>`+xs.map(t=>`<div class="chk tk-${TK[t.id]||"x"}"><span>${esc(t.text)}${t.who?` <span class="pill">${esc(t.who)}</span>`:""}</span><select data-tk="${esc(t.id)}" aria-label="Estado de ${esc(t.text)}">${TKS.map(([k,v])=>`<option value="${k}" ${(TK[t.id]||"")===k?"selected":""}>${v}</option>`).join("")}</select>${t.mine?`<button class="x" data-deltk="${esc(t.id)}" aria-label="Borrar">×</button>`:""}</div>`).join("")).join("")+
 `<form id="fTK" class="card" style="margin-top:18px"><label for="tkT">Agregar algo para sacar</label><input id="tkT" required placeholder="Ej.: entradas al museo X"><label for="tkC">Grupo</label><input id="tkC" value="Otros"><button class="btn" style="margin-top:12px">Agregar</button></form>`}
function vListas(){const cats={};for(const x of S.checklist){if(!(me==="Todos"||!x.who||x.who==="Todos"||x.who===me))continue;(cats[x.cat||"General"]=cats[x.cat||"General"]||[]).push(x)}
 return vTickets()+`<h2 style="margin-top:32px">Listas</h2><p class="sub">Documentos, equipaje y pendientes. Lo que tachás queda guardado solo en tu teléfono.</p>`+Object.entries(cats).map(([c,xs])=>`<h3>${esc(c)}</h3>`+xs.sort((a,b)=>(DONE[a.id]?1:0)-(DONE[b.id]?1:0)).map(x=>`<div class="chk ${DONE[x.id]?"done":""}"><input type="checkbox" data-chk="${esc(x.id)}" ${DONE[x.id]?"checked":""} aria-label="Hecho"><span>${esc(x.text)}${x.who&&x.who!=="Todos"?` <span class="pill">${esc(x.who)}</span>`:""}</span><button class="x" data-delc="${esc(x.id)}" aria-label="Borrar">×</button></div>`).join("")).join("")+
 `<form id="fC" class="card" style="margin-top:18px"><label for="cT">Nuevo ítem</label><input id="cT" required placeholder="Ej.: comprar entradas del Coliseo"><div class="g2"><div><label for="cC">Lista</label><input id="cC" list="cats" value="Antes de viajar"><datalist id="cats">${Object.keys(cats).map(c=>`<option value="${esc(c)}">`).join("")}<option value="Equipaje"></datalist></div><div><label for="cW">Para</label><select id="cW"><option>Todos</option>${PEOPLE.map(p=>`<option>${p}</option>`).join("")}</select></div></div><button class="btn" style="margin-top:12px">Agregar</button></form>`}
function vInfo(){const c=cfg(),rate=+(c.rates&&c.rates.EUR)||0;
 return `<h2>Info por país</h2><p class="sub">Lo básico de cada lugar del viaje. El 112 sirve para emergencias en toda la Unión Europea.</p>
 <div class="hero"><h3 style="margin-top:0">Conversor euro ↔ peso</h3><label for="rate">1 euro = ¿cuántos pesos? (cárguenlo ustedes con la cotización que usen)</label><input id="rate" type="number" inputmode="decimal" value="${rate||""}" placeholder="Ej.: cotización tarjeta">
 <div class="g2" style="margin-top:6px"><div><label for="eur">Euros</label><input id="eur" type="number" inputmode="decimal" placeholder="0"></div><div><label for="ars">Pesos</label><input id="ars" type="number" inputmode="decimal" placeholder="0"></div></div></div>
 ${c.countries.map(n=>{const k=COUNTRY[n];return `<div class="card"><div class="line"><h3 style="margin:0">${esc(n)}</h3><button class="x" data-delco="${esc(n)}" aria-label="Quitar país">×</button></div>${k?`<p style="margin:8px 0 0"><b>Moneda:</b> ${k.m}<br><b>Emergencias:</b> ${k.e}<br><b>Enchufes:</b> ${k.p}<br><b>Propinas:</b> ${k.tip}<br><b>Frases:</b> ${k.f}</p>`:`<p class="note">Sin datos cargados para este país.</p>`}</div>`}).join("")}
 <div class="card addco"><label for="addCo">Sumar país</label><div class="bar"><select id="addCo" style="flex:1">${Object.keys(COUNTRY).filter(k=>!c.countries.includes(k)).map(k=>`<option>${k}</option>`).join("")}</select><button class="btn" id="addCoB">Sumar</button></div>
<p class="note">En Argentina los enchufes son tipo I (patas planas en V): para Europa lleven adaptador, salvo los cargadores de dos patitas redondas (tipo C).</p></div>`}

const VIEWS={hoy:vHoy,manana:vManana,calendario:vCal,reservas:vRes,listas:vListas,info:vInfo};
function route(){const t=(location.hash||"#hoy").slice(1);return VIEWS[t]?t:"hoy"}
function render(){const t=route();document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t===t));
 $("#tripName").textContent=cfg().name;
 let h=VIEWS[t]();if(false)h=`<div class="card note">Conectando… lo que ves puede estar desactualizado.</div>`+h;
 $("#view").innerHTML=h;clocks()}
function clocks(){const f=tz=>new Date().toLocaleTimeString("es-AR",{timeZone:tz,hour:"2-digit",minute:"2-digit"});$("#clocks").innerHTML=`<span>Italia ${f("Europe/Rome")}</span><span>Argentina ${f("America/Argentina/Buenos_Aires")}</span>`}

/* ---------- edición ---------- */
const open=h=>{$("#dlg").innerHTML=h;$("#ov").classList.add("on");const f=$("#dlg input,#dlg select");f&&f.focus()};
const close=()=>$("#ov").classList.remove("on");
const tzSel=(id,v)=>`<select id="${id}">${TZS.map(([k,n])=>`<option value="${k}" ${k===v?"selected":""}>${n}</option>`).join("")}</select>`;
const pplBox=(name,sel)=>`<div class="ppl">${PEOPLE.map(p=>`<label><input type="checkbox" name="${name}" value="${p}" ${!sel||!sel.length||sel.includes(p)?"checked":""}>${p}</label>`).join("")}</div>`;
function editItem(it){if(!db)return;const n=!it.id;
 open(`<form id="fI"><h2>${n?"Nueva actividad":"Editar"}</h2>
 <label for="iT">Qué</label><input id="iT" required value="${esc(it.title||"")}" placeholder="Ej.: Tren Roma → Florencia">
 <div class="g2"><div><label for="iY">Tipo</label><select id="iY">${TYPES.map(([k,v])=>`<option value="${k}" ${k===(it.type||"actividad")?"selected":""}>${v}</option>`).join("")}</select></div><div><label for="iTz">Hora de</label>${tzSel("iTz",it.tz||"Europe/Rome")}</div></div>
 <div class="g2"><div><label for="iD">Fecha</label><input id="iD" type="date" required value="${esc(it.date||"")}"></div><div><label for="iH">Hora</label><input id="iH" type="time" value="${esc(it.time||"")}"></div></div>
 <details ${it.endDate||it.endTime?"open":""}><summary class="note" style="margin-top:10px;cursor:pointer">Llegada / fin (vuelos, trenes, check-out)</summary>
 <div class="g3"><div><label for="iED">Fecha</label><input id="iED" type="date" value="${esc(it.endDate||"")}"></div><div><label for="iEH">Hora</label><input id="iEH" type="time" value="${esc(it.endTime||"")}"></div><div><label for="iETz">Hora de</label>${tzSel("iETz",it.endTz||it.tz||"Europe/Rome")}</div></div></details>
 <label for="iP">Lugar o dirección (abre Maps)</label><input id="iP" value="${esc(it.place||"")}">
 <div class="g2"><div><label for="iCi">Ciudad (para el calendario)</label><input id="iCi" value="${esc(it.city||"")}"></div><div><label for="iCo">Código de reserva</label><input id="iCo" value="${esc(it.code||"")}"></div></div>
 <label>Quiénes</label>${pplBox("iW",it.who)}
 <label for="iN">Notas</label><textarea id="iN">${esc(it.notes||"")}</textarea>
 <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="iTbd" style="width:20px;min-height:0" ${it.tbd?"checked":""}> A confirmar</label>
 <div class="bar" style="margin-top:16px"><button class="btn">Guardar</button><button type="button" class="btn ghost" id="cancel">Cancelar</button>${n?"":`<button type="button" class="btn red" id="delI">Borrar</button>`}</div></form>`);
 $("#fI").onsubmit=async ev=>{ev.preventDefault();const v=id=>$("#"+id).value.trim();
  const data={title:v("iT"),type:v("iY"),tz:v("iTz"),date:v("iD"),time:v("iH"),endDate:v("iED"),endTime:v("iEH"),endTz:v("iETz"),place:v("iP"),city:v("iCi"),code:v("iCo"),notes:v("iN"),tbd:$("#iTbd").checked,who:[...document.querySelectorAll('[name=iW]:checked')].map(x=>x.value)};
  if(data.who.length===PEOPLE.length)data.who=[];
  if(await write(()=>n?db.collection("items").add(data):db.collection("items").doc(it.id).set(data)))close()};
 $("#cancel").onclick=close;
 const d=$("#delI");if(d)d.onclick=async()=>{if(d.dataset.sure){if(await write(()=>db.collection("items").doc(it.id).delete()))close()}else{d.dataset.sure=1;d.textContent="¿Seguro? Tocá de nuevo"}}}
async function write(fn){if(!db){toast("Activá el modo edición en Info para cambiar cosas.");return false}
 try{await fn();return true}catch(e){toast(e&&e.code==="auth"?"El token no sirve o venció: revisalo en Info.":"No se pudo guardar. Revisá la conexión.");load();return false}}
async function setCfg(patch){const c=Object.assign({},cfg(),patch);await write(()=>db.doc("config/main").set(c))}

/* ---------- eventos ---------- */
document.addEventListener("click",async ev=>{const t=ev.target.closest("[data-edit],[data-new],[data-wake],[data-dn],[data-day],[data-copy],[data-delc],[data-delco],#addCoB");if(!t)return;
 if(t.dataset.copy){ev.stopPropagation();try{await navigator.clipboard.writeText(t.dataset.copy);toast("Código copiado")}catch(e){toast("No se pudo copiar")}}
 else if(t.dataset.edit){const it=S.items.find(x=>x.id===t.dataset.edit);it&&editItem(it)}
 else if(t.dataset.new)editItem({date:t.dataset.new,type:t.dataset.ntype||"actividad",who:me==="Todos"?[]:[me]});
 else if(t.dataset.wake)editItem({date:t.dataset.wake,type:"despertar",title:"Despertarse",time:"08:00",who:me==="Todos"?[]:[me]});
 else if(t.dataset.dn!==undefined){const n=+t.dataset.dn;dayCursor=n===0?today():addDays(dayCursor||today(),n);render()}
 else if(t.dataset.day){dayCursor=t.dataset.day;if(location.hash==="#hoy")render();else location.hash="hoy";scrollTo(0,0)}
 else if(t.dataset.delc)write(()=>db.collection("checklist").doc(t.dataset.delc).delete());
 else if(t.dataset.delco)setCfg({countries:cfg().countries.filter(c=>c!==t.dataset.delco)});
 else if(t.id==="addCoB"){const v=$("#addCo").value;if(v)setCfg({countries:[...cfg().countries,v]})}});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.matches(".row,.cal .c"))ev.target.click();if(ev.key==="Escape")close()});
document.addEventListener("change",ev=>{const t=ev.target;
 if(t.dataset.tk!==undefined){if(t.value)TK[t.dataset.tk]=t.value;else delete TK[t.dataset.tk];saveTK();render();return}
 if(t.dataset.chk){DONE[t.dataset.chk]=t.checked;try{localStorage.setItem("viaje-done",JSON.stringify(DONE))}catch(e){}render()}else if(false){const x=S.checklist.find(c=>c.id===t.dataset.chk);if(x){const{id,...rest}=x;write(()=>db.collection("checklist").doc(id).set(Object.assign(rest,{done:t.checked})))}}
 if(t.id==="rate"&&!db){S.config=Object.assign({},S.config,{rates:{EUR:+t.value||0}});save()}else if(t.id==="rate"){setCfg({rates:Object.assign({},cfg().rates,{EUR:+t.value||0})})}});
document.addEventListener("input",ev=>{const t=ev.target,r=+($("#rate")&&$("#rate").value)||0;if(!r)return;
 if(t.id==="eur")$("#ars").value=t.value?Math.round(+t.value*r):"";if(t.id==="ars")$("#eur").value=t.value?(+t.value/r).toFixed(2):""});
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-deltk]");if(!t)return;TKX=TKX.filter(x=>x.id!==t.dataset.deltk);delete TK[t.dataset.deltk];saveTK();render()});
document.addEventListener("submit",async ev=>{if(ev.target.id==="fTK"){ev.preventDefault();const tx=$("#tkT").value.trim();if(tx){TKX.push({id:"x"+Date.now().toString(36),text:tx,cat:$("#tkC").value.trim()||"Otros"});saveTK();render()}return}
 if(ev.target.id!=="fC")return;ev.preventDefault();
 const d={text:$("#cT").value.trim(),cat:$("#cC").value.trim()||"General",who:$("#cW").value,done:false};if(d.text&&await write(()=>db.collection("checklist").add(d))){$("#cT").value=""}});
$("#ov").addEventListener("click",ev=>{if(ev.target.id==="ov")close()});
addEventListener("hashchange",()=>{if(route()==="hoy"&&!location.hash.includes("hoy"))dayCursor=today();render();scrollTo(0,0)});
setInterval(()=>{if(!$("#ov").classList.contains("on")&&!document.activeElement.matches("input,select,textarea"))render();else clocks()},30000);

/* ---------- datos compartidos ---------- */
render();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
let KEY=null,KSALT=null;
async function derive(pw,salt,iter){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(salt),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
async function decrypt(enc,key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(enc.iv)},key,u8(enc.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function fetchEnc(){const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;return r.json()}
function apply(d){PEOPLE=(d.config&&d.config.people)||[];S.items=d.items||[];S.checklist=d.checklist||[];S.config=d.config||{};if(!$("#ov").classList.contains("on"))render()}
async function load(){if(!KEY)return;try{const enc=await fetchEnc();if(enc.salt!==KSALT){lock();return}apply(await decrypt(enc,KEY))}catch(e){}}
function lock(){KEY=null;try{localStorage.removeItem("viaje-key")}catch(e){}
 $("#lock").style.display="flex";$("#pw").value="";}
document.body.classList.add("ro");
(async()=>{try{const s=JSON.parse(localStorage.getItem("viaje-key")||"null");
 if(s){KEY=await crypto.subtle.importKey("raw",u8(s.k),{name:"AES-GCM"},true,["decrypt"]);KSALT=s.salt}}catch(e){KEY=null}
 if(!KEY){lock();return}$("#lock").style.display="none";render();load()})();
$("#lockF").addEventListener("submit",async ev=>{ev.preventDefault();const btn=$("#lockF button");btn.disabled=true;btn.textContent="Abriendo…";$("#lockE").textContent="";
 try{const enc=await fetchEnc(),k=await derive($("#pw").value,enc.salt,enc.iter);const d=await decrypt(enc,k);
  KEY=k;KSALT=enc.salt;try{localStorage.setItem("viaje-key",JSON.stringify({k:b64(await crypto.subtle.exportKey("raw",k)),salt:enc.salt}))}catch(e){}
  $("#lock").style.display="none";apply(d)}catch(e){$("#lockE").textContent=navigator.onLine===false?"Sin conexión: la primera vez necesitás internet.":"Contraseña incorrecta."}
 btn.disabled=false;btn.textContent="Entrar"});
setInterval(()=>{if(document.visibilityState==="visible")load()},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
}
</script>
</body>
</html>
